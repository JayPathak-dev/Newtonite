services:
  db:
    image: postgres:16-alpine
    container_name: newtonite_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-newtonite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-newtonite_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-newtonite_ops}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-newtonite} -d ${POSTGRES_DB:-newtonite_ops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db_test:
    image: postgres:16-alpine
    container_name: newtonite_db_test
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-newtonite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-newtonite_dev_password}
      POSTGRES_DB: newtonite_ops_test
    ports:
      - "5436:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-newtonite} -d newtonite_ops_test"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  postgres_test_data:
